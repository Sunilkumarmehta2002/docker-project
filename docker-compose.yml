version: "3.8"
services:
  frontend:
    image: sunilkumarmehta2002/frontend
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 500M
    ports:
      - "5173:80"
    networks:
      - fitmitra_network

  backend:
    image: sunilkumarmehta2002/backend
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 1G
    ports:
      - "4000:4000"
    environment:
      - MONGO_URL=${MONGO_URL:?Set MONGO_URL in .env (see .env.example)}
    networks:
      - fitmitra_network

networks:
  fitmitra_network:
    driver: overlay
